<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DinoTopia</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 120%;
        }

        body {
            margin: 0;
            min-height: 120vh;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        /* Ana fotoğraf */
        .hero {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Alt bölüm */
        .bottom {
            height: 20vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .back-button {
            padding: 14px 35px;
            border: none;
            border-radius: 10px;
            background: #315c43;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button:hover {
            background: #407554;
        }
    </style>
</head>

<body>

    <div class="hero">
        <img src="dinotopia.png" alt="DinoTopia">
    </div>

    <div class="bottom">
        <button class="back-button" onclick="window.location.href='index.html'">
            BACK
        </button>
    </div>

</body>
</html>
