<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KIRBY</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 135%;
        }

        body {
            margin: 0;
            min-height: 135vh;
            background: #241035;
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        /* Siyah ana alan */
        .black-space {
            min-height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        /* KIRBY yazısı */
        .title {
            font-size: 70px;
            font-weight: 900;
            letter-spacing: 6px;
            margin: 0;
        }

        /* Alt mor alan */
        .purple-space {
            min-height: 35vh;
            background: #241035;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .back-button {
            padding: 14px 35px;
            border: none;
            border-radius: 10px;
            background: #315c43;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button:hover {
            background: #407554;
        }
    </style>
</head>

<body>

    <!-- Siyah alan -->
    <div class="black-space">

        <h1 class="title">KIRBY</h1>

        <button
            class="back-button"
            onclick="window.location.href='index.html'">
            BACK
        </button>

    </div>

    <!-- Mor alan -->
    <div class="purple-space"></div>

</body>
</html>
