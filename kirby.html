<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KIRBY</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 135%;
        }

        body {
            margin: 0;
            min-height: 135vh;
            background: #241035;
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        /* Black area */
        .black-space {
            min-height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        /* KIRBY title */
        .title {
            font-size: 70px;
            font-weight: 900;
            letter-spacing: 6px;
            margin: 0;
        }

        /* Purple area */
        .purple-space {
            min-height: 35vh;
            background: #241035;
            display: flex;
            align-items: center;
            position: relative;
        }

        /* Chicken section */
        .chicken-section {
            position: absolute;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);

            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .chicken-label {
            font-size: 28px;
            font-weight: bold;
        }

        .chicken-count {
            font-size: 24px;
            font-weight: bold;
        }

        .chicken-button {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            background: #315c43;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .chicken-button:hover {
            background: #407554;
        }

        /* Back button */
        .back-button {
            padding: 14px 35px;
            border: none;
            border-radius: 10px;
            background: #315c43;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button:hover {
            background: #407554;
        }
    </style>
</head>

<body>

    <!-- Black area -->
    <div class="black-space">

        <h1 class="title">KIRBY</h1>

        <button
            class="back-button"
            onclick="window.location.href='index.html'">
            BACK
        </button>

    </div>

    <!-- Purple area -->
    <div class="purple-space">

        <div class="chicken-section">

            <div class="chicken-label">
                CHICKEN:
            </div>

            <div class="chicken-count" id="chickenCount">
                0
            </div>

            <button
                class="chicken-button"
                onclick="addChicken()">
                CHICKEN
            </button>

        </div>

    </div>

    <script>
        // Load the saved chicken count
        let chicken = Number(localStorage.getItem("kirbyChicken")) || 0;

        document.getElementById("chickenCount").textContent = chicken;

        function addChicken() {
            chicken++;

            // Update the displayed count
            document.getElementById("chickenCount").textContent = chicken;

            // Save the count
            localStorage.setItem("kirbyChicken", chicken);
        }
    </script>

</body>
</html>
