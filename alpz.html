<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALPZ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 135%;
        }

        body {
            margin: 0;
            min-height: 135vh;
            background: #35104f;
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        .video-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        #player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.78vh;
            transform: translate(-50%, -50%);
        }

        /* YouTube */
        .youtube-button {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;

            padding: 16px 35px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 10px;
            background: rgba(120, 120, 120, 0.45);
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            backdrop-filter: blur(4px);
        }

        .youtube-button:hover {
            background: rgba(150, 150, 150, 0.6);
        }

        /* Siyah BACK alanı - ÜST */
        .black-space {
            min-height: 22vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .back-button {
            padding: 14px 35px;
            border: none;
            border-radius: 10px;
            background: #315c43;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button:hover {
            background: #407554;
        }

        /* Mor CHICKEN alanı - ALT */
        .chicken-area {
            min-height: 35vh;
            background: #35104f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .chicken-title {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .chicken-count {
            margin: 0;
            font-size: 34px;
            font-weight: 900;
        }

        .egg-button {
            padding: 12px 38px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            background: rgba(160, 160, 160, 0.45);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .egg-button:hover {
            background: rgba(180, 180, 180, 0.6);
        }
    </style>
</head>

<body>

    <!-- VIDEO -->
    <div class="video-section">

        <div id="player"></div>

        <a
            class="youtube-button"
            href="https://www.youtube.com/@Adrian.alpz1813"
            target="_blank">
            YOUTUBE
        </a>

    </div>

    <!-- SIYAH + BACK -->
    <div class="black-space">

        <button
            class="back-button"
            onclick="window.location.href='index.html'">
            BACK
        </button>

    </div>

    <!-- MOR + CHICKEN -->
    <div class="chicken-area">

        <h2 class="chicken-title">
            CHICKEN:
        </h2>

        <div
            class="chicken-count"
            id="chickenCount">
            0
        </div>

        <button
            class="egg-button"
            onclick="addChicken()">
            EGG
        </button>

    </div>

    <script>
        let chickenCount =
            Number(localStorage.getItem("chickenCount")) || 0;

        document.getElementById("chickenCount").textContent =
            chickenCount;

        function addChicken() {
            chickenCount++;

            document.getElementById("chickenCount").textContent =
                chickenCount;

            localStorage.setItem(
                "chickenCount",
                chickenCount
            );
        }
    </script>

    <!-- YOUTUBE API -->
    <script>
        let player;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player("player", {
                videoId: "PVy-bcTsO8A",

                playerVars: {
                    autoplay: 1,
                    controls: 1,
                    loop: 1,
                    playlist: "PVy-bcTsO8A",
                    rel: 0
                },

                events: {
                    onReady: function(event) {
                        event.target.unMute();
                        event.target.setVolume(10);
                        event.target.setPlaybackRate(2);
                        event.target.playVideo();
                    },

                    onStateChange: function(event) {
                        if (event.data === YT.PlayerState.PLAYING) {
                            event.target.unMute();
                            event.target.setVolume(10);
                            event.target.setPlaybackRate(2);
                        }
                    }
                }
            });
        }
    </script>

    <script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
