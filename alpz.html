<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALPZ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 120%;
        }

        body {
            margin: 0;
            min-height: 120vh;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        .video-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        #player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.78vh;
            transform: translate(-50%, -50%);
        }

        .bottom {
            height: 25vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .back-button {
            padding: 14px 35px;
            border: none;
            border-radius: 10px;
            background: #315c43;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button:hover {
            background: #407554;
        }

        .code-machine {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .code-input {
            width: 180px;
            height: 42px;
            padding: 0 12px;
            border: 2px solid #315c43;
            border-radius: 8px;
            background: #102d1e;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .code-input::placeholder {
            color: #8ca997;
        }

        .check-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 8px;
            background: #315c43;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .check-button:hover {
            background: #407554;
        }
    </style>
</head>

<body>

    <div class="video-section">
        <div id="player"></div>
    </div>

    <div class="bottom">
        <button
            class="back-button"
            onclick="window.location.href='index.html'">
            BACK
        </button>
    </div>

    <div class="code-machine">
        <input
            type="text"
            id="codeInput"
            class="code-input"
            placeholder="Code Machine"
        >

        <button
            class="check-button"
            onclick="checkCode()">
            ✓
        </button>
    </div>

    <script>
        let player;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player("player", {
                videoId: "PVy-bcTsO8A",

                playerVars: {
                    autoplay: 1,
                    mute: 1,
                    controls: 1,
                    loop: 1,
                    playlist: "PVy-bcTsO8A",
                    rel: 0
                },

                events: {
                    onReady: function(event) {
                        event.target.mute();
                        event.target.setPlaybackRate(2);
                        event.target.playVideo();
                    },

                    onStateChange: function(event) {
                        if (event.data === YT.PlayerState.PLAYING) {
                            event.target.mute();
                            event.target.setPlaybackRate(2);
                        }
                    }
                }
            });
        }

        function checkCode() {
            const code = document
                .getElementById("codeInput")
                .value
                .trim()
                .toUpperCase();

            if (code === "DINOTOPIA") {
                window.location.href = "dinotopia.html";
            }
        }
    </script>

    <script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
