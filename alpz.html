<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALPZ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 120%;
        }

        body {
            margin: 0;
            min-height: 120vh;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        .video-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        #player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.78vh;
            transform: translate(-50%, -50%);
        }

        /* YouTube Button */
        .youtube-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;

            padding: 16px 35px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 10px;

            background: rgba(120, 120, 120, 0.45);
            color: white;

            font-size: 18px;
            font-weight: bold;
            text-decoration: none;

            backdrop-filter: blur(4px);
            cursor: pointer;
        }

        .youtube-button:hover {
            background: rgba(150, 150, 150, 0.6);
        }

        /* Bottom */
        .bottom {
            height: 25vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .back-button {
            padding: 14px 35px;
            border: none;
            border-radius: 10px;
            background: #315c43;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button:hover {
            background: #407554;
        }
    </style>
</head>

<body>

    <!-- Video -->
    <div class="video-section">

        <div id="player"></div>

        <!-- YouTube Button -->
        <a
            class="youtube-button"
            href="https://www.youtube.com/@Adrian.alpz1813"
            target="_blank">
            YOUTUBE
        </a>

    </div>

    <!-- Back -->
    <div class="bottom">
        <button
            class="back-button"
            onclick="window.location.href='index.html'">
            BACK
        </button>
    </div>

    <script>
        let player;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player("player", {
                videoId: "PVy-bcTsO8A",

                playerVars: {
                    autoplay: 1,
                    controls: 1,
                    loop: 1,
                    playlist: "PVy-bcTsO8A",
                    rel: 0
                },

                events: {
                    onReady: function(event) {
                        event.target.unMute();
                        event.target.setVolume(20);
                        event.target.setPlaybackRate(2);
                        event.target.playVideo();
                    },

                    onStateChange: function(event) {
                        if (event.data === YT.PlayerState.PLAYING) {
                            event.target.unMute();
                            event.target.setVolume(20);
                            event.target.setPlaybackRate(2);
                        }
                    }
                }
            });
        }
    </script>

    <script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
