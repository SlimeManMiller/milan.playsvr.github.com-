
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UPGRADE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 135%;
        }

        body {
            margin: 0;
            min-height: 135vh;
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;

            background:
                linear-gradient(
                    to bottom,
                    #000000 0%,
                    #000000 8%,
                    #6e256f 8%,
                    #6e256f 25%,
                    #0ed145 25%,
                    #0ed145 42%,
                    #6e256f 42%,
                    #6e256f 59%,
                    #8700ff 59%,
                    #8700ff 76%,
                    #6e256f 76%,
                    #6e256f 93%,
                    #381556 93%,
                    #381556 100%
                );
        }

        .main {
            min-height: 135vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 35px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
        }
    </style>
</head>

<body>

    <div class="main">
        <h1>UPGRADE</h1>
    </div>

</body>
</html>
