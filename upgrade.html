<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UPGRADE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 135%;
        }

        body {
            margin: 0;
            min-height: 135vh;

            color: white;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                to bottom,
                #000000 0%,
                #000000 8%,

                #6e256f 8%,
                #6e256f 31%,

                #0ed145 31%,
                #0ed145 54%,

                #8700ff 54%,
                #8700ff 77%,

                #381556 77%,
                #381556 100%
            );

            overflow-y: auto;
        }

        .upgrade-title {
            position: absolute;
            top: 25px;
            left: 30px;

            margin: 0;

            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .back-button {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);

            padding: 12px 30px;

            border: none;
            border-radius: 9px;

            background: rgba(80, 80, 80, 0.7);
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .back-button:hover {
            background: rgba(100, 100, 100, 0.85);
        }
    </style>
</head>

<body>

    <h1 class="upgrade-title">UPGRADE</h1>

    <button
        class="back-button"
        onclick="window.location.href='index.html'">
        BACK
    </button>

</body>
</html>
