<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UPGRADE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 135vh;
        }

        body {
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;

            background: linear-gradient(
                to bottom,
                #000000 0vh,
                #000000 10vh,

                #6e256f 10vh,
                #6e256f 45vh,

                #0ed145 45vh,
                #0ed145 80vh,

                #8700ff 80vh,
                #8700ff 115vh,

                #381556 115vh,
                #381556 135vh
            );
        }

        .upgrade-title {
            position: absolute;
            top: 25px;
            left: 25px;

            margin: 0;

            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .back-button {
            position: absolute;
            top: 25px;
            left: 50%;

            transform: translateX(-50%);

            padding: 12px 30px;

            border: none;
            border-radius: 9px;

            background: rgba(80, 80, 80, 0.7);
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .back-button:hover {
            background: rgba(100, 100, 100, 0.85);
        }

        .upgrade-button {
            position: absolute;

            left: 50%;
            transform: translateX(-50%);

            padding: 14px 40px;

            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;

            background: rgba(120, 120, 120, 0.55);
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        .upgrade-button:hover {
            background: rgba(150, 150, 150, 0.7);
        }

        .upgrade-1 {
            top: 27vh;
        }

        .upgrade-2 {
            top: 62vh;
        }

        .upgrade-3 {
            top: 97vh;
        }

        .upgrade-4 {
            top: 124vh;
        }
    </style>
</head>

<body>

    <h1 class="upgrade-title">UPGRADE</h1>

    <button
        class="back-button"
        onclick="window.location.href='index.html'">
        BACK
    </button>

    <button class="upgrade-button upgrade-1" type="button">
        UPGRADE
    </button>

    <button class="upgrade-button upgrade-2" type="button">
        UPGRADE
    </button>

    <button class="upgrade-button upgrade-3" type="button">
        UPGRADE
    </button>

    <button class="upgrade-button upgrade-4" type="button">
        UPGRADE
    </button>

</body>
</html>
