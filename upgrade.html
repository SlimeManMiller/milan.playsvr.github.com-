<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UPGRADE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 135%;
        }

        body {
            margin: 0;
            min-height: 135vh;

            color: white;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                to bottom,
                #000000 0%,
                #000000 7%,

                #6e256f 7%,
                #6e256f 24%,

                #0ed145 24%,
                #0ed145 41%,

                #6e256f 41%,
                #6e256f 58%,

                #8700ff 58%,
                #8700ff 75%,

                #6e256f 75%,
                #6e256f 92%,

                #381556 92%,
                #381556 100%
            );
            background-attachment: fixed;
        }

        .main {
            min-height: 135vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding-top: 35px;
        }

        h1 {
            margin: 0;

            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
        }
    </style>
</head>

<body>

    <div class="main">
        <h1>UPGRADE</h1>
    </div>

</body>
</html>
