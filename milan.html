<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MILANPLAYSVR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 135%;
        }

        body {
            margin: 0;
            min-height: 135vh;
            background: #123d2a;
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        .main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .space {
            height: 65vh;
        }

        .back-area {
            min-height: 35vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .back-button {
            padding: 14px 35px;
            border: none;
            border-radius: 10px;
            background: #315c43;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button:hover {
            background: #407554;
        }
    </style>
</head>

<body>

    <div class="main">

        <h1>MILANPLAYSVR</h1>

        <div class="space"></div>

    </div>

    <div class="back-area">
        <button
            class="back-button"
            onclick="window.location.href='index.html'">
            BACK
        </button>
    </div>

</body>
</html>
