<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DinoTopia</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 120%;
        }

        body {
            margin: 0;
            min-height: 120vh;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        .hero {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .bottom {
            height: 20vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .back-button {
            padding: 14px 35px;
            border: none;
            border-radius: 10px;
            background: #315c43;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button:hover {
            background: #407554;
        }

        /* Code Machine */
        .code-machine {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .code-input {
            width: 180px;
            height: 42px;
            padding: 0 12px;
            border: 2px solid #315c43;
            border-radius: 8px;
            background: #102d1e;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .code-input::placeholder {
            color: #8ca997;
        }

        .check-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 8px;
            background: #315c43;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .check-button:hover {
            background: #407554;
        }
    </style>
</head>

<body>

    <div class="hero">
        <img src="dinotopia.png" alt="DinoTopia">
    </div>

    <div class="bottom">
        <button class="back-button" onclick="window.location.href='index.html'">
            BACK
        </button>
    </div>

    <div class="code-machine">
        <input
            type="text"
            id="codeInput"
            class="code-input"
            placeholder="Code Machine"
        >

        <button class="check-button" onclick="checkCode()">✓</button>
    </div>

    <script>
        function checkCode() {
            const code = document.getElementById("codeInput").value.trim().toUpperCase();

            if (code === "ALPZ") {
                window.location.href = "alpz.html";
            }
        }
    </script>

</body>
</html>
