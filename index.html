<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HUB</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 135%;
        }

        body {
            margin: 0;
            min-height: 135vh;
            background: #123d2a;
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        .main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .space {
            height: 65vh;
        }

        /* Shared Code Box */
        .code-box {
            position: fixed;
            bottom: 25px;

            display: flex;
            align-items: center;
            gap: 8px;

            z-index: 10;
        }

        /* Room Code - Bottom Left */
        .room-code {
            left: 25px;
        }

        /* Code Machine - Bottom Right */
        .code-machine {
            right: 25px;
        }

        .code-box input {
            width: 190px;
            padding: 12px 14px;

            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;

            background: rgba(0, 0, 0, 0.35);
            color: white;

            font-size: 15px;
            outline: none;
        }

        .code-box input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        .code-box button {
            width: 44px;
            height: 44px;

            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;

            background: rgba(160, 160, 160, 0.45);
            color: white;

            font-size: 22px;
            font-weight: bold;

            cursor: pointer;
        }

        .code-box button:hover {
            background: rgba(190, 190, 190, 0.6);
        }
    </style>
</head>

<body>

    <div class="main">

        <h1>HUB</h1>

        <div class="space"></div>

    </div>

    <!-- Room Code -->
    <div class="code-box room-code">

        <input
            type="text"
            id="roomCodeInput"
            placeholder="ROOM CODE"
            autocomplete="off"
        >

        <button onclick="checkRoomCode()">✓</button>

    </div>

    <!-- Code Machine -->
    <div class="code-box code-machine">

        <input
            type="text"
            placeholder="CODE MACHINE"
            autocomplete="off"
        >

        <button>✓</button>

    </div>

    <script>

        function checkRoomCode() {

            const code = document
                .getElementById("roomCodeInput")
                .value
                .trim()
                .toUpperCase();

            if (code === "DINOTOPIA") {
                window.location.href = "dinotopia.html";
            }

            else if (code === "ALPZ") {
                window.location.href = "alpz.html";
            }

            else if (code === "KIRBY") {
                window.location.href = "kirby.html";
            }

            else if (code === "MILAN") {
                window.location.href = "milan.html";
            }

            else if (code === "SLIME") {
                // Nothing happens for now
            }
        }

        /* Enter key works only for Room Code */
        document
            .getElementById("roomCodeInput")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    checkRoomCode();
                }

            });

    </script>

</body>
</html>
