<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MILANPLAYSVR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 110%;
        }

        body {
            margin: 0;
            min-height: 110vh;
            background: #0b2418;
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        .container {
            min-height: 115vh;
            padding-top: 70px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        /* Code Machine */
        .code-machine {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .code-input {
            width: 180px;
            height: 42px;
            padding: 0 12px;
            border: 2px solid #315c43;
            border-radius: 8px;
            background: #102d1e;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .code-input::placeholder {
            color: #8ca997;
        }

        .check-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 8px;
            background: #315c43;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .check-button:hover {
            background: #407554;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>MILANPLAYSVR</h1>
    </div>

    <div class="code-machine">
        <input
            type="text"
            id="codeInput"
            class="code-input"
            placeholder="Code Machine"
        >

        <button class="check-button" onclick="checkCode()">✓</button>
    </div>

    <script>
        function checkCode() {
            const code = document.getElementById("codeInput").value.trim();

            if (code.toUpperCase() === "DINOTOPIA") {
                window.location.href = "dinotopia.html";
            }
        }
    </script>

</body>
</html>
