<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SLIME</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 135%;
        }

        body {
            margin: 0;
            min-height: 135vh;
            background: #7fd66f;
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        .main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
        }

        .title {
            margin: 0;
            font-size: 38px;
            font-weight: 900;
            text-align: center;
            letter-spacing: 1px;
        }

        .quests {
            width: 100%;
            max-width: 700px;
            margin-top: 55px;
        }

        .quest-section {
            margin-bottom: 45px;
        }

        .section-title {
            font-size: 30px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .quest {
            background: rgba(0, 0, 0, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 15px 18px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        /* Quest with checkbox */
        .quest-check {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quest-check input {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: white;
            flex-shrink: 0;
        }

        .locked {
            text-align: center;
        }

        .unlock-time {
            display: block;
            margin-top: 6px;
            font-size: 14px;
            font-weight: normal;
            opacity: 0.8;
        }

        .back-button {
            margin-top: 20px;
            padding: 14px 35px;
            border: none;
            border-radius: 10px;
            background: rgba(80, 80, 80, 0.65);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button:hover {
            background: rgba(100, 100, 100, 0.8);
        }
    </style>
</head>

<body>

    <div class="main">

        <h1 class="title">
            TO UNLOCK YOUR ROOM "SLIME", YOU NEED TO COMPLETE ONE OF THESE QUESTS:
        </h1>

        <div class="quests">

            <!-- 1/3 -->
            <div class="quest-section">

                <div class="section-title">1/3</div>

                <div class="quest quest-check">
                    <input type="checkbox">
                    <span>HATCH 10 CHICKEN EGGS - UG VR</span>
                </div>

                <div class="quest quest-check">
                    <input type="checkbox">
                    <span>HATCH 20 CHICKEN EGGS - UG VR</span>
                </div>

                <div class="quest quest-check">
                    <input type="checkbox">
                    <span>OPEN A DINOSOGUR EGG - UG VR</span>
                </div>

            </div>

            <!-- 2/3 -->
            <div class="quest-section">

                <div class="section-title">2/3</div>

                <div class="quest locked">
                    ???
                    <span class="unlock-time">UNLOCKS IN 30 MIN</span>
                </div>

                <div class="quest locked">
                    ???
                    <span class="unlock-time">UNLOCKS IN 30 MIN</span>
                </div>

                <div class="quest locked">
                    ???
                    <span class="unlock-time">UNLOCKS IN 30 MIN</span>
                </div>

            </div>

            <!-- 3/3 -->
            <div class="quest-section">

                <div class="section-title">3/3</div>

                <div class="quest">
                    ???
                </div>

                <div class="quest">
                    ???
                </div>

                <div class="quest">
                    ???
                </div>

            </div>

        </div>

        <button
            class="back-button"
            onclick="window.location.href='index.html'">
            BACK
        </button>

    </div>

</body>
</html>
