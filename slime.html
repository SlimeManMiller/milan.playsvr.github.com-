<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SLIME</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 135%;
        }

        body {
            margin: 0;
            min-height: 135vh;
            background: #7fd66f;
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        .main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .upgrade-title {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
        }

        .upgrade-subtitle {
            margin-top: 8px;
            font-size: 18px;
            font-weight: bold;
            opacity: 0.8;
            text-align: center;
        }

        .back-button {
            margin-top: 40px;
            padding: 14px 35px;
            border: none;
            border-radius: 10px;
            background: rgba(80, 80, 80, 0.65);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button:hover {
            background: rgba(100, 100, 100, 0.8);
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="upgrade-title">
            UPGRADE NEEDED
        </div>

        <div class="upgrade-subtitle">
            IN UPGRADE PAGE
        </div>

        <button
            class="back-button"
            onclick="window.location.href='index.html'">
            BACK
        </button>

    </div>

</body>
</html>
