<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SLIMEMANMILLERVR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 135%;
        }

        body {
            margin: 0;
            min-height: 135vh;
            background: #7fd66f;
            color: white;
            font-family: Arial, sans-serif;
            overflow-y: auto;
        }

        .main {
            min-height: 100vh;
            position: relative;
            padding-top: 40px;
        }

        /* Title */
        .title {
            margin: 0;
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        /* Slime counter */
        .slime-area {
            position: absolute;
            top: 42%;
            right: 12%;
            transform: translateY(-50%);

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .slime-count {
            font-size: 32px;
            font-weight: 900;
        }

        .create-button {
            padding: 12px 38px;

            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;

            background: rgba(160, 160, 160, 0.45);
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .create-button:hover {
            background: rgba(180, 180, 180, 0.6);
        }

        /* Bottom area */
        .bottom-space {
            min-height: 35vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 50px;
        }

        .back-button {
            padding: 14px 35px;

            border: none;
            border-radius: 10px;

            background: #315c43;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        .back-button:hover {
            background: #407554;
        }
    </style>
</head>

<body>

    <div class="main">

        <!-- TITLE -->
        <h1 class="title">
            SLIMEMANMILLERVR
        </h1>

        <!-- SLIME COUNTER -->
        <div class="slime-area">

            <div class="slime-count" id="slimeCount">
                SLIMES: 0
            </div>

            <button
                class="create-button"
                onclick="createSlime()">
                CREATE
            </button>

        </div>

    </div>

    <!-- LOWER BACK AREA -->
    <div class="bottom-space">

        <button
            class="back-button"
            onclick="window.location.href='index.html'">
            BACK
        </button>

    </div>

    <script>
        let slimeCount =
            Number(localStorage.getItem("slimeCount")) || 0;

        document.getElementById("slimeCount").textContent =
            "SLIMES: " + slimeCount;

        function createSlime() {
            slimeCount++;

            document.getElementById("slimeCount").textContent =
                "SLIMES: " + slimeCount;

            localStorage.setItem(
                "slimeCount",
                slimeCount
            );
        }
    </script>

</body>
</html>
